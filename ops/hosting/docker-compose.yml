name: reverse-cloud-hosting

services:
  ollama:
    image: ollama/ollama@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    container_name: reverse-cloud-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  web:
    image: ${WEB_IMAGE:-reverse-cloud-preview:unconfigured}
    container_name: reverse-cloud-web
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./secrets/web.env:/app/apps/web/.env.local:ro
    environment:
      LOCAL_OLLAMA_PREVIEW: "false"
      AI_SERVICE_URL: http://127.0.0.1:8000
      TRUSTED_PUBLIC_ORIGINS: ${PUBLIC_ORIGIN:-https://invalid.example}
    depends_on:
      ai:
        condition: service_healthy
    command:
      - pnpm
      - --filter
      - "@reverse-cloud/web"
      - exec
      - next
      - start
      - -H
      - localhost
      - -p
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  ai:
    image: ${AI_IMAGE:-reverse-cloud-ai:unconfigured}
    container_name: reverse-cloud-ai
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./secrets/web.env:/app/services/ai/.env.local:ro
    environment:
      OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: llama3.2:1b
      OLLAMA_EMBEDDING_MODEL: qwen3-embedding:0.6b
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 127.0.0.1
      - --port
      - "8000"
      - --proxy-headers
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  tunnel:
    image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    container_name: reverse-cloud-tunnel
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./secrets/cloudflare-tunnel-token:/run/secrets/cloudflare-tunnel-token:ro
    command:
      - tunnel
      - --protocol
      - http2
      - --metrics
      - 127.0.0.1:2000
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare-tunnel-token
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  ollama_models:
    external: true
    name: hosting_ollama_models
